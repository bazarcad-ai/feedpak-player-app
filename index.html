<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Feedpak Player" />
    <meta name="theme-color" content="#14161b" />
    <title>Feedpak Player</title>
    <script>
      // Safety net that runs even if the app bundle fails to load: never let the browser
      // navigate to / download a dropped file, and tell the user what went wrong.
      ["dragover", "drop"].forEach((t) => window.addEventListener(t, (e) => e.preventDefault()));
      window.addEventListener("load", () => setTimeout(() => {
        if (window.__feedpakReady) return;
        const s = document.getElementById("status");
        s.hidden = false;
        s.className = "status error";
        s.style.cssText = "position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:#2a1416;border:1px solid #ff5a5f;color:#ffb3b5;padding:16px 20px;border-radius:10px;font:15px system-ui;max-width:80%;text-align:center;z-index:9";
        s.textContent = location.protocol === "file:"
          ? "The player didn't start. This looks like the source page — open feedpak-player.html (in the project folder) instead."
          : "The player didn't start. Try reloading the page.";
      }, 300));
    </script>

  <body>
    <header class="top">
      <div class="song">
        <img id="cover" alt="" hidden />
        <div>
          <div id="title" class="title">Feedpak Player</div>
          <div id="subtitle" class="subtitle">Open a song to start</div>
        </div>
      </div>
      <div class="open">
        <label class="btn primary">Open file<input id="fileInput" type="file" hidden /></label>
        <label class="btn" id="folderBtn">Open folder<input id="folderInput" type="file" webkitdirectory hidden /></label>
      </div>
    </header>

    <nav id="arrTabs" class="tabs" aria-label="Arrangements"></nav>

    <div class="toolbar">
      <div class="seg" role="group" aria-label="View">
        <button id="modeScroll" class="active" title="Tab scrolls past a fixed playhead">Scrolling</button>
        <button id="modePage" title="Static page; a cursor follows the music">Page</button>
      </div>
      <label class="check" title="Standard notation derived from the tab"><input id="notation" type="checkbox" /> Notation</label>
      <label class="check" title="Note durations under the tab (stems, beams and rests) — no staff"><input id="rhythm" type="checkbox" /> Rhythm</label>
      <div class="seg" role="group" aria-label="Audio" title="What you hear: the recording, the tab notes played by a synth, or both">
        <button id="audioSong" class="active">Song</button>
        <button id="audioTab">Tab</button>
        <button id="audioBoth">Both</button>
      </div>
      <div class="metro" title="Metronome clicks on the song's beats (accent on the first beat of each bar)">
        <label class="check"><input id="metronome" type="checkbox" /> Metronome</label>
      </div>
      <div class="speed" title="Playback speed (pitch is preserved)">
        <span class="lbl">Speed</span>
        <button id="slower" aria-label="Slower">−</button>
        <input id="speed" type="range" min="25" max="150" step="5" value="100" aria-label="Speed" />
        <button id="faster" aria-label="Faster">+</button>
        <button id="speedLabel" class="val" title="Reset to 100%">100%</button>
      </div>
      <label class="zoom" id="zoomWrap">Zoom <input id="zoom" type="range" min="60" max="400" value="160" /></label>
      <div class="tool-right">
      <div class="pop-wrap">
        <button id="mixerBtn" class="btn small" aria-haspopup="true" aria-expanded="false" title="Volumes: song, tab synth, metronome, master">🎚 Mixer</button>
        <div id="mixerPanel" class="popover mixer" hidden>
          <div class="pop-title">Mixer <span class="hint">double-click a slider for 100 %</span></div>
          <div id="mixerRows"></div>
        </div>
      </div>
      <div class="pop-wrap">
        <button id="colorsBtn" class="btn small" aria-haspopup="true" aria-expanded="false" title="String colours">🎨 Colours</button>
        <div id="colorsPanel" class="popover" hidden>
          <div class="pop-title">String colours</div>
          <label class="pop-row">Preset <select id="colorPreset"></select></label>
          <div id="colorList" class="color-list"></div>
          <div class="pop-foot"><button id="colorReset" class="btn small">Reset to default</button></div>
        </div>
      </div>
      <button id="sectionsToggle" class="btn small">Sections</button>
      </div>
    </div>

    <div class="body">
      <aside id="sections" class="sections" aria-label="Sections">
        <div class="sec-head">Sections <span class="hint">click to loop · shift-click to extend</span></div>
        <div id="sectionList" class="sec-list"></div>
      </aside>
      <main class="stage">
        <canvas id="tab"></canvas>
        <div id="status" class="status" hidden></div>
        <div id="drop" class="drop" hidden>Drop .feedpak to open</div>
      </main>
    </div>

    <footer class="transport">
      <div class="row">
        <button id="play" class="play" disabled aria-label="Play">▶</button>
        <span id="cur" class="time">0:00</span>
        <div class="timeline">
          <div id="loopRegion" class="loop-region" hidden>
            <div id="handleA" class="handle a" title="Drag loop start"></div>
            <div id="handleB" class="handle b" title="Drag loop end"></div>
          </div>
          <input id="seek" type="range" min="0" max="1" step="0.01" value="0" disabled aria-label="Position" />
        </div>
        <span id="dur" class="time">0:00</span>
        <button id="loopToggle" class="btn small" disabled title="Loop on/off (L)">⟲ Loop</button>
      </div>
      <div id="loopBar" class="row loopbar" hidden>
        <span id="loopName" class="loop-name"></span>
        <div class="ab">
          <span class="ab-l">Start</span>
          <button data-nudge="a,-1,bar" title="Previous bar">⇤</button>
          <button data-nudge="a,-1,beat" title="Previous beat">‹</button>
          <button data-nudge="a,-1,fine" title="−0.05 s">−</button>
          <input id="loopA" class="t" inputmode="decimal" aria-label="Loop start" />
          <button data-nudge="a,1,fine" title="+0.05 s">+</button>
          <button data-nudge="a,1,beat" title="Next beat">›</button>
          <button data-nudge="a,1,bar" title="Next bar">⇥</button>
          <button data-here="a" title="Set start to current position ([)">⌖</button>
        </div>
        <div class="ab">
          <span class="ab-l">End</span>
          <button data-nudge="b,-1,bar" title="Previous bar">⇤</button>
          <button data-nudge="b,-1,beat" title="Previous beat">‹</button>
          <button data-nudge="b,-1,fine" title="−0.05 s">−</button>
          <input id="loopB" class="t" inputmode="decimal" aria-label="Loop end" />
          <button data-nudge="b,1,fine" title="+0.05 s">+</button>
          <button data-nudge="b,1,beat" title="Next beat">›</button>
          <button data-nudge="b,1,bar" title="Next bar">⇥</button>
          <button data-here="b" title="Set end to current position (])">⌖</button>
        </div>
        <button id="loopClear" class="btn small" title="Remove loop">✕ Clear</button>
      </div>
    </footer>
  </body>
</html>
